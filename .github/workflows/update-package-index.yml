name: Update package_index.json

on:
  repository_dispatch:
    types:
      - package-index-updated
  workflow_dispatch:

concurrency:
  group: update-package-index
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-package-index:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download package indexes
        run: |
          set -euo pipefail
          mkdir -p tmp
          curl -fsSL "https://raw.githubusercontent.com/tanakamasayuki/host-arduino-core/main/package_index.json" -o tmp/host-package_index.json
          curl -fsSL "https://raw.githubusercontent.com/tanakamasayuki/native-arduino-core/main/package_index.json" -o tmp/native-package_index.json

      - name: Merge package indexes
        run: |
          set -euo pipefail
          python3 scripts/merge_package_indexes.py \
            --output package_index.json \
            tmp/host-package_index.json \
            tmp/native-package_index.json

      - name: Commit package_index.json
        run: |
          set -euo pipefail
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add package_index.json
          if git diff --staged --quiet; then
            echo "No package_index.json changes to commit"
          else
            git commit -m "Update merged package_index.json"
            git push
          fi

      - name: Prepare GitHub Pages artifact
        run: |
          set -euo pipefail
          mkdir -p public
          cp package_index.json public/package_index.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
